<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroVision - Scheme Discovery</title>
    
    <!-- External CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Mobile Hamburger Toggle -->
    <div id="mobile-hamburger-btn" class="mobile-menu-toggle">
        <i class="fas fa-bars"></i>
    </div>

    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span style="font-size:1.6rem;">🌾</span>
                <span class="sidebar-logo-text">AgroVision</span>
            </div>
            
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="dashboard.html" class="sidebar-link">
                        <i class="fas fa-seedling"></i> <span>Crop Advisor</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="discovery.html" class="sidebar-link active">
                        <i class="fas fa-search"></i> <span>Scheme Discovery</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="videos.html" class="sidebar-link">
                        <i class="fas fa-video"></i> <span>Video Tutorials</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="profile.html" class="sidebar-link">
                        <i class="fas fa-robot"></i> <span>AI Scheme Matching</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="resume.html" class="sidebar-link">
                        <i class="fas fa-file-contract"></i> <span>Credentials Resume</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="chatbot.html" class="sidebar-link">
                        <i class="fas fa-robot"></i> <span>Advisor Bot</span>
                    </a>
                </li>
                <li class="sidebar-item" style="border-top:1px solid var(--border-color); padding-top: 10px; margin-top: 10px;">
                    <a href="index.html" class="sidebar-link">
                        <i class="fas fa-home"></i> <span>Return Home</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-user">
                <div class="user-avatar">F</div>
                <div class="user-info">
                    <span class="user-name">Farmer Name</span>
                    <span class="user-role">Farmer (State)</span>
                </div>
                <button id="sidebar-logout-btn" class="logout-btn" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-dashboard">
            <header class="dashboard-header">
                <div class="header-title-section">
                    <h1 id="discovery-header-title" style="font-size:2rem; margin:0; letter-spacing:-0.5px;">🌾 Explore Available Schemes</h1>
                    <span class="header-subtitle">Search and filter all central and state-sponsored benefits.</span>
                </div>
                
                <div class="lang-select-wrapper">
                    <select id="global-lang-select" class="lang-select" aria-label="Select Language">
                        <option value="English">English</option>
                        <option value="हिंदी">हिंदी</option>
                        <option value="मराठी">मराठी</option>
                        <option value="తెలుగు">తెలుగు</option>
                        <option value="മലയാളം">മലയാളം</option>
                        <option value="ਪੰਜਾਬੀ">ਪੰਜਾਬੀ</option>
                        <option value="ગુજરાતી">ગુજરાતી</option>
                    </select>
                </div>
            </header>

            <!-- Search bar & Categories filter grid -->
            <section class="search-filter-container" style="max-width:100%; margin-bottom:2rem;">
                <div class="search-input-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="scheme-search-input" class="search-field" placeholder="Search by scheme name or keyword...">
                    <button id="search-mic-btn" class="mic-btn" title="Voice Search"><i class="fas fa-microphone"></i></button>
                </div>
                <div class="lang-select-wrapper">
                    <select id="category-filter-select" class="filter-select" aria-label="Category Filter">
                        <option value="All">All Categories</option>
                        <option value="Income">Income Support</option>
                        <option value="Insurance">Insurance</option>
                        <option value="Credit">Credit/Loans</option>
                        <option value="Energy">Energy/Solar Pumps</option>
                        <option value="Soil">Soil Health</option>
                    </select>
                </div>
            </section>

            <!-- Loader placeholder -->
            <div id="schemes-loader-placeholder"></div>

            <!-- Render List Target -->
            <div id="schemes-list-container" class="schemes-list"></div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
    <script src="js/animation.js"></script>
</body>
</html>
